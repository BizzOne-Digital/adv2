services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - lfi_mongo_data:/data/db

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/light_for_immigrants
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SESSION_SECRET: docker-dev-session-secret-min-32-chars
      ADMIN_SEED_EMAIL: admin@example.com
      ADMIN_SEED_PASSWORD: ChangeMe-Strong-Temp-Password-123
    volumes:
      - lfi_uploads:/app/public/uploads
    depends_on:
      - mongodb

volumes:
  lfi_mongo_data:
  lfi_uploads:
